# Site
name: "A Data GUY obs"
title: "A DATA GUY obs"
description: "NOT information only, Here you will read Experience."
logo: 'assets/images/logo.png'
favicon: 'assets/images/guy.png'
baseurl: ""
#google_analytics: 'UA-46278016-1'
disqus: 'demowebsite'
mailchimp-list: "https://gmail.us16.list-manage.com/subscribe/post?u=e751325e0922fcc09056995a6&amp;id=8e2526747b&amp;f_id=001242e0f0"
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  Prayas:
    name: Prayas
    display_name: Prayas
    
    email: themonarch257@gmail.com
    
    description:  "I write about data, technology, learning and my journey in the data world."
  
# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
